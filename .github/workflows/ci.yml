name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and rewrites the
          # lockfile, but it does NOT download packages: on a fresh checkout
          # `.mooncakes/` is still absent when it finishes. `moon install` is
          # what actually populates it, and the staging step below has nothing
          # to copy into until it has run. Verified on a runner: without this
          # line the staging step exits 1 with
          # ".mooncakes/riantr/pyroduct/src is missing".
          moon install

      - name: Run tests (native)
        run: moon test --target native

      - name: Run tests (js)
        run: moon test --target js

  build-native:
    name: Build (native)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and rewrites the
          # lockfile, but it does NOT download packages: on a fresh checkout
          # `.mooncakes/` is still absent when it finishes. `moon install` is
          # what actually populates it, and the staging step below has nothing
          # to copy into until it has run. Verified on a runner: without this
          # line the staging step exits 1 with
          # ".mooncakes/riantr/pyroduct/src is missing".
          moon install

      - name: Build backend (native)
        run: moon build --target native cmd/server

  build-js:
    name: Build (js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and rewrites the
          # lockfile, but it does NOT download packages: on a fresh checkout
          # `.mooncakes/` is still absent when it finishes. `moon install` is
          # what actually populates it, and the staging step below has nothing
          # to copy into until it has run. Verified on a runner: without this
          # line the staging step exits 1 with
          # ".mooncakes/riantr/pyroduct/src is missing".
          moon install

      - name: Build frontend (js)
        run: moon build --target js cmd/web
