name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Run tests (native)
        run: moon test --target native

      - name: Run tests (js)
        run: moon test --target js

      # The README states how many tests, mutations and gates this project
      # has, and those numbers are a claim about the tree. The document
      # carried six stale counts, all wrong in the same direction, because
      # nothing checked them.
      #
      # The gate is an invariant rather than a snapshot -- the number the
      # document states IS the number the tree has -- so it keeps holding
      # as tests are added and removed. It reads only, and it takes a
      # second.
      - name: Check the README's numbers against the tree
        run: pwsh tools/check-readme.ps1

  # The gates that live in `ci.sh` but were never wired into this workflow.
  #
  # The five jobs below are the ones a push is checked against, and until now
  # the contract tests, the component tests, the static analysis and the
  # dynamic analysis had never run on the runner at all: `ci.sh` holds
  # seventeen gates and this workflow called none of them. A gate that is only
  # ever run by hand is a gate that is only ever run by the person who wrote
  # it, and the five here are the ones that catch things the unit tests
  # cannot: the shape of an API response, the way the modules compose, and
  # what a running server does with a request it should refuse.
  #
  # The dynamic analysis gate starts its own server now -- it used to look
  # for one on MAKED_PORT and skip the live checks when it found none, so
  # the live path was covered by nothing -- and it brings the interpreter up
  # by whichever name the machine has, because `python` is not on the PATH of
  # a current runner and `python3` is.
  #
  # The mutation batteries are not here: they rewrite the source and re-run
  # the suites two hundred and twenty-nine times, which is an hour of CI for
  # a check that a push does not change. They are `tools/mutate-*.ps1`, and
  # `bash ci.sh` runs them.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Contract tests (the shape of every response)
        run: bash tools/contract-test.sh

      - name: Component tests (the modules composing)
        run: bash tools/component-test.sh

      - name: Static analysis
        run: bash tools/sast-check.sh

      - name: Dynamic analysis
        run: bash tools/dast-check.sh

      - name: Dependency versions
        run: bash tools/dep-check.sh

      # The other documents a reader is sent to make the same kind of claim
      # the README does -- a count, a shape, a file and line to look at -- and
      # they rotted the same way: four API endpoints when there were
      # thirty-seven, "no Dockerfile" when there was one, and a hundred
      # file:line references pointing at lines that had moved. The README has
      # a gate for its numbers; this is the same gate for architecture/,
      # AGENT.md and the note in the release archive.
      #
      # It reads only and takes a second.
      - name: Documents against the tree
        run: bash tools/check-docs.sh

      - name: README numbers against the tree
        run: bash tools/check-readme.sh

  build-native:
    name: Build (native)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Build backend (native)
        run: moon build --target native cmd/server

  build-js:
    name: Build (js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Build frontend (js)
        run: moon build --target js cmd/web

  # The integration tests are the safety net for the failure that cost this
  # project the most: a batch of requests at start-up that reached the server,
  # changed the state, and never came back. The screen froze on stale data
  # and nothing in the console said why.
  #
  # The unit tests cannot catch that class -- it is a property of the HTTP
  # round-trip, not of any one function -- and the container job only asks
  # one question of a running image. So the whole route table is exercised
  # here, over real HTTP, with the requests fired *concurrently* and the
  # assertions made on what the server ended up with.
  #
  # The script is PowerShell rather than bash so that one file serves this
  # machine and the runner: the runner's ubuntu image carries `pwsh`. The
  # bash twin (`tools/integration-test.sh`) stays for the bash-only gates.
  #
  # The runner is ubuntu, not windows: that is the platform the product
  # ships on (the container below), and it is the platform this repository's
  # CI already knows how to provision a MoonBit toolchain for.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Build the browser bundle
        run: moon build --release --target js cmd/web

      - name: Stage the bundle where the server looks for it
        run: |
          cp _build/js/release/build/cmd/web/web.js frontend/dist/main.js

      - name: Run the integration tests
        run: pwsh tools/integration-test.ps1

  # The container is built on every push, not only at release time, and it is
  # started and asked a question. A Dockerfile that builds but serves
  # nothing is worse than no Dockerfile: it looks like it works.
  container:
    name: Container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: maked:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and ask it something
        run: |
          docker run -d --name maked -p 8080:8080 maked:ci
          answered=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status >/dev/null 2>&1; then
              answered=1
              break
            fi
            sleep 1
          done
          # A container that starts and then says nothing is the failure mode
          # this step exists to catch, and the reason it says nothing is in
          # its own output: the exit code tells you whether the process died
          # (126 is "exec format error", 127 is "not found") and the logs
          # tell you why. Without this, the only evidence is a connection
          # reset, which says nothing about the cause.
          if [ "$answered" -ne 1 ]; then
            echo "::group::the container did not answer"
            docker ps -a --filter name=maked
            docker inspect --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' maked || true
            echo "::endgroup::"
            echo "::group::container logs"
            docker logs maked || true
            echo "::endgroup::"
            docker rm -f maked || true
            exit 1
          fi
          echo "--- /api/status ---"
          curl -fsS http://127.0.0.1:8080/api/status
          echo
          echo "--- / (the browser shell) ---"
          curl -fsS http://127.0.0.1:8080/ | head -c 300
          echo
          # The bundle is the one thing a broken image usually loses: it is
          # build output, and the image rebuilds it rather than copying it.
          echo "--- /main.js (the bundle) ---"
          curl -fsS -o /dev/null -w "%{http_code} %{size_download} bytes\n" \
            http://127.0.0.1:8080/main.js
          docker rm -f maked
