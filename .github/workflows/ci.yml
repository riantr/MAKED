name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Run tests (native)
        run: moon test --target native

      - name: Run tests (js)
        run: moon test --target js

  build-native:
    name: Build (native)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Build backend (native)
        run: moon build --target native cmd/server

  build-js:
    name: Build (js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Build frontend (js)
        run: moon build --target js cmd/web

  # The integration tests are the safety net for the failure that cost this
  # project the most: a batch of requests at start-up that reached the server,
  # changed the state, and never came back. The screen froze on stale data
  # and nothing in the console said why.
  #
  # The unit tests cannot catch that class -- it is a property of the HTTP
  # round-trip, not of any one function -- and the container job only asks
  # one question of a running image. So the whole route table is exercised
  # here, over real HTTP, with the requests fired *concurrently* and the
  # assertions made on what the server ended up with.
  #
  # The script is PowerShell rather than bash so that one file serves this
  # machine and the runner: the runner's ubuntu image carries `pwsh`. The
  # bash twin (`tools/integration-test.sh`) stays for the bash-only gates.
  #
  # The runner is ubuntu, not windows: that is the platform the product
  # ships on (the container below), and it is the platform this repository's
  # CI already knows how to provision a MoonBit toolchain for.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Build the browser bundle
        run: moon build --release --target js cmd/web

      - name: Stage the bundle where the server looks for it
        run: |
          cp _build/js/release/build/cmd/web/web.js frontend/dist/main.js

      - name: Run the integration tests
        run: pwsh tools/integration-test.ps1

  # The container is built on every push, not only at release time, and it is
  # started and asked a question. A Dockerfile that builds but serves
  # nothing is worse than no Dockerfile: it looks like it works.
  container:
    name: Container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: maked:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and ask it something
        run: |
          docker run -d --name maked -p 8080:8080 maked:ci
          answered=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status >/dev/null 2>&1; then
              answered=1
              break
            fi
            sleep 1
          done
          # A container that starts and then says nothing is the failure mode
          # this step exists to catch, and the reason it says nothing is in
          # its own output: the exit code tells you whether the process died
          # (126 is "exec format error", 127 is "not found") and the logs
          # tell you why. Without this, the only evidence is a connection
          # reset, which says nothing about the cause.
          if [ "$answered" -ne 1 ]; then
            echo "::group::the container did not answer"
            docker ps -a --filter name=maked
            docker inspect --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' maked || true
            echo "::endgroup::"
            echo "::group::container logs"
            docker logs maked || true
            echo "::endgroup::"
            docker rm -f maked || true
            exit 1
          fi
          echo "--- /api/status ---"
          curl -fsS http://127.0.0.1:8080/api/status
          echo
          echo "--- / (the browser shell) ---"
          curl -fsS http://127.0.0.1:8080/ | head -c 300
          echo
          # The bundle is the one thing a broken image usually loses: it is
          # build output, and the image rebuilds it rather than copying it.
          echo "--- /main.js (the bundle) ---"
          curl -fsS -o /dev/null -w "%{http_code} %{size_download} bytes\n" \
            http://127.0.0.1:8080/main.js
          docker rm -f maked
