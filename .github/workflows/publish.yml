name: publish-package
run-name: publish MAKED ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  # Tag-push triggering is ON.
  #
  # It was never enabled on this repository before: MAKED had only ci.yml, so a
  # tag produced no publish run at all. moonbit_doubleML's history is the
  # cautionary tale -- its tag triggering was switched off (7186945) because
  # every tag push went red, and the recorded reason ("the token is not set")
  # turned out to be incomplete: the last run to reach the end died at
  # `Check typos`, not at the token.
  #
  # So the two things that made that repository red are handled here
  # explicitly, before the publish step can be reached:
  #   1. `Check typos` runs as its own gate, and it is the gate most likely to
  #      fail on a documentation-heavy release.
  #   2. The publish step guards a missing secret before it writes anything,
  #      and says what the secret must CONTAIN if it is present but wrong.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.7"
        required: true
        type: string

permissions:
  contents: write
  # The container image is pushed to ghcr.io, which is a package registry and
  # needs its own permission.
  packages: write

concurrency:
  group: publish-maked-moonbit-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.19.0

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      # The tag and the manifest must agree. If they drift, `moon publish`
      # uploads a version that no tag describes, and mooncakes `latest` then
      # points at something the tag order does not suggest.
      - name: Resolve release version
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi

          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must use the v* format, got: $tag" >&2
              exit 1
              ;;
          esac

          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' moon.mod)"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag version $version does not match moon.mod version $manifest_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all

      - name: Update dependencies
        run: |
          moon update
          # `moon update` refreshes the registry index and the lockfile, but
          # it does not download the packages.
          #
          # Until 0.1.20261016 the download was a separate `moon install`.
          # That form is now a hard error -- "the following required
          # arguments were not provided: <SOURCE>" -- because installing
          # without a source means installing a binary globally, which is a
          # different command. The toolchain now resolves the dependency
          # tree itself during `moon check`, `moon build` and `moon test`.
          #
          # Verified on a fresh clone with no `.mooncakes/` at all: each of
          # those three populates it and succeeds. So there is nothing left
          # to do here but refresh the index.
          moon update

      - name: Check package
        run: |
          echo "::group::moon check --target native"
          moon check --target native
          echo "::endgroup::"
          echo "::group::moon check --target js"
          moon check --target js
          echo "::endgroup::"

      - name: Test package
        run: |
          echo "::group::moon test --target native"
          moon test --target native
          echo "::endgroup::"
          echo "::group::moon test --target js"
          moon test --target js
          echo "::endgroup::"

      - name: Check formatting
        run: moon fmt --check

      # The historical blocker on this account. Kept as its own step so a typo
      # names itself instead of surfacing as an unexplained red publish.
      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Check typos
        run: typos

      # Runs immediately before the publish step, because publishing is the
      # only thing that puts this README in front of users.
      #
      # The version is checked rather than the whole file: `moon.mod` is the
      # authority (checked against the tag above) and README is the other place
      # a version string can go stale, where nothing would catch it.
      - name: Check README version matches the manifest
        run: |
          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' moon.mod)"
          if ! grep -q "v${manifest_version}" README.md; then
            echo "::error::README.md does not mention v${manifest_version}; sync it before tagging" >&2
            exit 1
          fi

      # moon publish exits 255 for "secret missing", "secret has the wrong
      # shape", "publish rejected" and "version already exists", so without
      # this guard the annotation names none of them.
      #
      # WHAT THE SECRET MUST CONTAIN: the JSON BODY of
      # ~/.moon/credentials.json -- an object with non-empty "token" and
      # "username" keys -- NOT a bare token string. The step below writes
      # $SECRET straight to that path, so a bare token produces a file that
      # does not parse and moon publish fails with an opaque auth error.
      # Idempotent on purpose, for the same reason the release step below is.
      # A version that is already on the registry cannot be published again --
      # `moon publish` exits 255 for "version already exists" -- but the
      # assets (the binaries, the container image) still have to be built and
      # attached. So the publish is skipped when the version is already there,
      # and the rest of the run carries on.
      #
      # The check is `moon view <module>@<version>`: it succeeds for a
      # published version and fails with a 404 for one that is not.
      - name: Publish to Mooncakes
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository; moon publish cannot authenticate. If it IS set, check its SHAPE: it must be the JSON body of ~/.moon/credentials.json, not a bare token."
            exit 1
          fi
          version="${{ steps.release.outputs.version }}"
          if moon view "riantr/MAKED@${version}" >/dev/null 2>&1; then
            echo "riantr/MAKED@${version} is already on the registry; skipping the publish"
            echo "the assets for this release are still built and attached by the jobs below"
            exit 0
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish
        env:
          SECRET: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}

      # Idempotent on purpose. `gh release create` aborts when a release for the
      # tag already exists, so re-tagging an already-published version turns the
      # run red at THIS step even though `moon publish` on the step above
      # succeeded and the package is on the registry. Re-tagging is routine here
      # -- it happened when v0.1.4 was re-cut under the name riantr/MAKED -- so
      # "already exists" is the expected state, not a failure.
      #
      # The delete keeps the tag: only the release object is replaced, and
      # --generate-notes rebuilds the notes from the new commits.
      - name: Create GitHub Release
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "a release for $tag already exists; replacing it"
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" \
            --title "MAKED ${{ steps.release.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------
  # Prebuilt binaries, one per platform.
  #
  # The barrier this removes: the MoonBit toolchain, a C toolchain, and a
  # build step. Someone who only wants to *look at* MAKED should have to
  # install none of it.
  #
  # The archive holds the executable AND the browser files it serves. The
  # binary on its own would answer the API and show no site: the server
  # reads frontend/dist from disk, and says so in a warning when it is
  # missing. An archive with only the executable is a trap.
  #
  # This job runs in parallel with the package publish rather than after
  # it, so the release is not twice as long. It therefore resolves the
  # version itself instead of taking it from the publish job's outputs.
  # ---------------------------------------------------------------------
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other two: a release with
      # two of three binaries is more useful than no release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          # macos-14 is the arm64 runner, and it has to be: the toolchain
          # installer recognises "Darwin arm64" and "Linux x86_64" only, so
          # an Intel macOS runner fails with "Unsupported platform".
          - os: macos-14
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must use the v* format, got: $tag" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MoonBit (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The installer writes to the user PATH and says "restart your
          # terminal"; GITHUB_PATH is the runner's way of doing that.
          #
          # The response is a byte array, not a string: the installer is
          # served as application/octet-stream, and `iex` on a byte array
          # fails with "Cannot convert 'System.Byte[]' to the type
          # 'System.String' required by parameter 'Command'". Decoding it
          # first is the whole fix.
          $script = (Invoke-WebRequest -Uri https://cli.moonbitlang.com/install/powershell.ps1 -UseBasicParsing).Content
          if ($script -is [byte[]]) {
            $script = [System.Text.Encoding]::UTF8.GetString($script)
          }
          iex $script
          "$HOME\.moon\bin" >> $env:GITHUB_PATH

      - name: Install dependencies
        # No `shell:` here on purpose. The `matrix` context is not available
        # to a step's `shell` key -- GitHub rejects the whole workflow with
        # "Unrecognized named-value: 'matrix'" -- and the runner's default
        # shell is already the right one per platform: bash on Linux and
        # macOS, pwsh on Windows. Both run these two commands the same way.
        run: |
          moon version --all
          # The toolchain resolves the dependency tree itself during
          # `moon build`; `moon install` without a source is a hard error
          # since 0.1.20261016. `moon update` only refreshes the index.
          moon update

      - name: Build
        run: |
          moon build --release --target js cmd/web
          moon build --release --target native cmd/server

      # Where the build actually put things. The packaging step finds the
      # executable with `find` rather than a fixed path, so this is not needed
      # to make it work -- it is here so the layout is visible in the log when
      # a packaging step fails, instead of guessed at.
      #
      # Unix only: on the Windows runner `find` is a PowerShell alias for
      # Select-String, and running this there fails the build step for a
      # reason that has nothing to do with the build.
      - name: Show the build output
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "::group::build output"
          find _build -maxdepth 6 -type f \( -name 'server' -o -name 'server.exe' -o -name 'web.js' \) | head -20
          echo "::endgroup::"

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          mkdir -p stage/maked/frontend/dist
          # The executable is found, not assumed. Its path inside `_build/` is
          # moon's business, and a fixed path is what made the first release
          # attempt fail on the platform nobody could test locally.
          #
          # It is `server.exe` on Linux too: the native backend names its
          # executables with the Windows extension whatever the host is, so
          # both spellings are accepted here.
          server_bin="$(find _build/native -type f \( -name 'server' -o -name 'server.exe' \) | head -1)"
          if [ -z "$server_bin" ]; then
            echo "::error::no native server executable found under _build/native"
            find _build -maxdepth 6 -type f -name 'server*' | head -20
            exit 1
          fi
          echo "server executable: $server_bin"
          cp "$server_bin" stage/maked/server
          cp frontend/dist/index.html frontend/dist/styles.css stage/maked/frontend/dist/
          cp _build/js/release/build/cmd/web/web.js stage/maked/frontend/dist/main.js
          cp packaging/RUN.txt stage/maked/RUN.txt
          # The example model ships with the binary, so that a reader who has
          # just unpacked it can run a machine of their own without first
          # finding a file to point at.
          mkdir -p stage/maked/models
          cp models/*.json stage/maked/models/
          chmod +x stage/maked/server
          tar -czf "maked-${version}-${{ matrix.target }}.tar.gz" -C stage maked

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path stage\maked\frontend\dist | Out-Null
          $server = Get-ChildItem -Path _build\native -Recurse -File -Filter server.exe | Select-Object -First 1
          if (-not $server) {
            Write-Error "no native server executable found under _build/native"
            Get-ChildItem -Path _build -Recurse -File -Filter 'server*' | Select-Object -First 20
            exit 1
          }
          Write-Host "server executable: $($server.FullName)"
          Copy-Item $server.FullName stage\maked\server.exe
          Copy-Item frontend\dist\index.html, frontend\dist\styles.css stage\maked\frontend\dist\
          Copy-Item _build\js\release\build\cmd\web\web.js stage\maked\frontend\dist\main.js
          Copy-Item packaging\RUN.txt stage\maked\RUN.txt
          # The example model ships with the binary, so that a reader who has
          # just unpacked it can run a machine of their own without first
          # finding a file to point at.
          New-Item -ItemType Directory -Force -Path stage\maked\models | Out-Null
          Copy-Item models\*.json stage\maked\models\
          Compress-Archive -Path stage\maked -DestinationPath "maked-${version}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: maked-${{ steps.ver.outputs.version }}-${{ matrix.target }}
          path: maked-${{ steps.ver.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The binaries go on the release itself, so there is one place to look.
  # ---------------------------------------------------------------------
  release-assets:
    name: Attach binaries
    runs-on: ubuntu-latest
    needs: [publish, binaries]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the three archives, by name. Without the pattern this
          # downloads every artifact in the run, including the container
          # build's cache blob, which is large and occasionally fails to
          # download after five retries -- failing the step that was only
          # ever meant to pick up three files.
          pattern: maked-*

      - name: Upload to the release
        run: |
          tag="${{ needs.publish.outputs.tag }}"
          shopt -s nullglob
          for archive in artifacts/*/*; do
            echo "attaching $archive"
            # --repo is not optional here. This job downloads artifacts and
            # never checks out the repository, so `gh` has no git remote to
            # read and fails with "not a git repository" -- which says
            # nothing about the upload it was in the middle of.
            gh release upload "$tag" "$archive" --clobber --repo "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------
  # The container image.
  #
  # The image name is written out rather than derived from
  # github.repository, because a registry path has to be lower case and the
  # repository is not.
  # ---------------------------------------------------------------------
  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/riantr/maked:${{ needs.publish.outputs.version }}
            ghcr.io/riantr/maked:latest
          labels: |
            org.opencontainers.image.title=MAKED
            org.opencontainers.image.description=MAKED on MoonBit: a five-domain loop you can put your own work into
            org.opencontainers.image.version=${{ needs.publish.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
