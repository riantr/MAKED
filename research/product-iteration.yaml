# A mapping table for the product-iteration model.
#
# The table says what a document means: which words make a rule fire, and
# which slot the rule drives. The slots are the model's, so this table fits
# models/product-iteration.json and not the built-in model, whose slots have
# other names.
#
# The order is the priority. The first rule that matches wins, so the rule
# for a question comes before the rule for a build, and a document that
# mentions both is read as the question it opens with.
#
#   MAKED_MODEL=models/product-iteration.json
#   MAKED_RESEARCH=research/product-iteration.yaml
#   slots: ask, scope, build, ship
#
# The slots are written down so a gate can read them, and the gate checks
# them against the machine named above: a rule that drives a slot the
# machine does not have is refused at start-up, and a header that names
# slots the machine does not have is a sentence nobody believes.
#
# The file's name decides how it is read: a .yaml file is read as YAML and
# every other file as JSON. It is written back in the same syntax, so an
# edit made in the browser does not turn the file into something else.
format: maked.research.v1
mapping:
  - label: A question worth asking
    label_zh: 一个值得问的问题
    keywords:
      - question
      - why
      - unclear
      - ask
    keywords_zh:
      - 问题
      - 为什么
      - 不清楚
      - 询问
    slot: ask
    notes: The document opens a question rather than answering one.
    notes_zh: 这份文档提出的是问题，而不是答案。
  - label: A scope worth setting
    label_zh: 一个值得划定的范围
    keywords:
      - scope
      - plan
      - requirement
      - boundary
    keywords_zh:
      - 范围
      - 计划
      - 需求
      - 边界
    slot: scope
    notes: The document says what will and will not be done.
    notes_zh: 这份文档说明要做什么、不做什么。
  - label: A thing being built
    label_zh: 正在做出来的东西
    keywords:
      - build
      - implement
      - code
      - prototype
    keywords_zh:
      - 构建
      - 实现
      - 代码
      - 原型
    slot: build
    notes: The document is about making the thing.
    notes_zh: 这份文档讲的是把它做出来。
  - label: A thing going out
    label_zh: 要交出去的东西
    keywords:
      - ship
      - release
      - deploy
      - launch
    keywords_zh:
      - 发布
      - 部署
      - 上线
      - 交付
    slot: ship
    notes: The document is about putting it in front of people.
    notes_zh: 这份文档讲的是把它交到人手里。
fallback:
  label: Anything else
  label_zh: 其他
  slot: scope
