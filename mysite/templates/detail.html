{% extends "base.html" %}

{% block title %}{{ article.article_title }}{% endblock title %}

{% block content %}

    <article class="maked-article">
        {{ article.article_content|safe }}
    </article>
    <p><small>Created {{ article.article_create_time }}</small></p>
{% endblock content %}
