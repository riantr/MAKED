{% load menu_tags %}
{% for child in children %}
    <li class="{% if child.selected %}active{% endif %}{% if child.children %} dropdown{% endif %}">
        <a href="{{ child.get_absolute_url }}">{{ child.get_menu_title }}</a>
        {% if child.children %}
            <ul class="dropdown-menu">
                {% show_menu from_level to_level extra_inactive extra_active "" "" child %}
            </ul>
        {% endif %}
    </li>
{% endfor %}
